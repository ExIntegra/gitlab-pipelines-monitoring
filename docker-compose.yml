services:
  gitlab-exporter:
    image: mvisonneau/gitlab-ci-pipelines-exporter:latest
    container_name: gitlab-exporter
    restart: unless-stopped

    command: ["run", "--config", "/etc/config.yml"]

    ports:
      - "8081:8080"

    env_file:
      - .env

    volumes:
      - ./config.yml:/etc/config.yml:ro

    networks:
      - gitlab-monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: gitlab-prometheus
    restart: unless-stopped

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-data:/prometheus

    ports:
      - "127.0.0.1:9090:9090"

    depends_on:
      - gitlab-exporter

    command:
      - --config.file=/etc/prometheus/prometheus.yml

    networks:
      - gitlab-monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: gitlab-grafana
    restart: unless-stopped

    environment:
      GF_SECURITY_ADMIN_USER: ${GRANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_PLUGINS_PREINSTALL: grafana-polystat-panel

    volumes:
      - grafana-data:/var/lib/grafana

    ports:
      - "127.0.0.1:3000:3000"

    depends_on:
      - prometheus

    networks:
      - gitlab-monitoring

volumes:
  prometheus-data:
  grafana-data:

networks:
  gitlab-monitoring:
    driver: bridge
    name: my-monitoring-net # фиксированное имя сети в Docker (иначе будет <проект>_monitoring)
    ipam: # своя подсеть, если нужна статика
      config:
        - subnet: 172.28.0.0/16
